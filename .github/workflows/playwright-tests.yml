name: Playwright Tests

# setup the trigger
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read


jobs:

  playwright-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest  # virtual machine (ubuntu-latest for linux, windows-latest for Windows, macos-latest for macOS) to run the tests
    timeout-minutes: 30 # maximum time the job can run before being automatically cancelled

    env: # mapping the secret to an environment variable that can be used in the tests
      PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }} 
      PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci  # npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run tests:headless

        # generate a Playwright HTML report and test result
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
