name: Regression Tests

on: # when the workflow should run

  push: # Automatically run the workflow when a push is made to the main branch
    branches:
      - main

  pull_request: # Automatically run the workflow when a pull request is opened against the main branch
    branches:
      - main

  schedule: # Automatically run the workflow on a schedule (daily at 12:00 PM EST)
    - cron: '0 17 * * *' # Runs daily at 12:00 PM EST (UTC equivalent for EST)

  workflow_dispatch: # Allows manual triggering of the workflow from the GitHub Actions tab

jobs:
  regression-tests:
    timeout-minutes: 60  # Set a timeout for the job to prevent it from running indefinitely
    runs-on: ubuntu-latest # Uses linux virtual environment for the job (windows-latest or macos-latest can also be used)

    env:
      PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
      PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}
    
    # setup the node JS environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
    
      # Install dependencies
      - name: Install dependencies
        run: npm ci
    
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
    
      # Run regression tests
      - name: Run regression tests
        run: npm run tests:headless
    
      # Upload Playwright report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

